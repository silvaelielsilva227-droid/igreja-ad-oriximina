name: Gerar apps (Windows .exe e Android .apk)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'mobile/**', 'img/icons/**', '.github/workflows/apps.yml']

permissions:
  contents: write

jobs:
  windows:
    name: App Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ícone
        shell: bash
        run: cp img/icons/icon-512.png desktop/icon.png
      - name: Instalar dependências
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Gerar .exe
        working-directory: desktop
        run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/*.exe

  android:
    name: App Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependências
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Criar projeto Android
        working-directory: mobile
        run: npx cap add android
      - name: Ícones do app
        working-directory: mobile
        run: |
          mkdir -p assets
          cp ../img/icons/icon-1024.png assets/icon-only.png
          cp ../img/icons/icon-1024.png assets/icon-foreground.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#4c1d95' --iconBackgroundColorDark '#4c1d95' || echo "Usando ícone padrão"
      - name: Sincronizar
        working-directory: mobile
        run: npx cap sync android
      - name: Compilar APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renomear
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk AD-Oriximina.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: AD-Oriximina.apk

  publicar:
    name: Publicar na página de downloads
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apps-v1.${{ github.run_number }}
          name: Apps AD Oriximiná v1.${{ github.run_number }}
          make_latest: true
          files: saida/*
          body: |
            ## Downloads
            - **Windows (instalador):** `AD-Oriximina-Instalador.exe`
            - **Windows (portátil, sem instalar):** `AD-Oriximina-Portatil.exe`
            - **Android:** `AD-Oriximina.apk` — no celular, permita "instalar apps de fontes desconhecidas".

            Os apps abrem o sistema publicado em https://silvaelielsilva227-droid.github.io/igreja-ad-oriximina/ e precisam de internet.
